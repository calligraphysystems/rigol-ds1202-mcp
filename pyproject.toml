[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigol-ds1202-mcp"
version = "0.5.1"
description = "Local MCP server for the Rigol DS1202Z-E oscilloscope"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "pyvisa>=1.14,<2", "pyvisa-py>=0.7,<1", "pyusb>=1.2,<2", "pillow>=11,<13", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rigol-mcp = "rigol_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/fixture", "/deploy", "/examples",
           "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md",
           "/CHANGELOG.md", "/requirements.lock", "/pyproject.toml", "/SOURCE-MANIFEST.json"]
